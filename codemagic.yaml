workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    environment:
      java: 21
    scripts:
      - name: Set up gradle wrapper
        script: |
          gradle wrapper --gradle-version 9.3.1
      - name: Build Android Release
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
